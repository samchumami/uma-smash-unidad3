name: uma-server-ci
on:
  push:
    branches: [main]
permissions:
  id-token: write      # OIDC: GitHub pide credenciales temporales a AWS, sin llaves guardadas
  contents: read
env:
  AWS_REGION: us-east-1
  IMG: 493667572687.dkr.ecr.us-east-1.amazonaws.com/uma-server
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Pruebas
        run: pip install -r requirements.txt pytest && pytest -q
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::493667572687:role/github-deployer
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Construir y publicar imagen
        run: |
          docker build -t $IMG:${{ github.sha }} .
          docker push $IMG:${{ github.sha }}
