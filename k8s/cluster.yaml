# Cluster EKS de Uma Smash (practica 3.3): 3 nodos que pueden crecer hasta 12 (practica 3.4)
# Crear:   eksctl create cluster -f cluster.yaml
# Borrar:  eksctl delete cluster -f cluster.yaml --disable-nodegroup-eviction
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: uma
  region: us-east-1
  version: "1.35"                  # Agones soporta 1.34-1.36
iam:
  withOIDC: true
managedNodeGroups:
  - name: game-pool
    instanceType: c7i.xlarge        # 4 vCPU / 8 GiB, optimizada a computo (la que sugiere la guia)
    minSize: 3
    maxSize: 12
    desiredCapacity: 3
    privateNetworking: false        # Agones necesita IP publica en los nodos
    labels: { rol: juego }
    tags:
      k8s.io/cluster-autoscaler/enabled: "true"
      k8s.io/cluster-autoscaler/uma: "owned"
    iam:
      withAddonPolicies:
        autoScaler: true
