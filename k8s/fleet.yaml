apiVersion: agones.dev/v1
kind: Fleet
metadata:
  name: uma-fleet
spec:
  replicas: 3
  template:
    spec:
      ports:
        - name: game
          containerPort: 7654
          protocol: TCP            # WebSocket viaja sobre TCP
      health: { initialDelaySeconds: 10, periodSeconds: 5 }
      template:
        spec:
          containers:
            - name: uma-server
              image: 493667572687.dkr.ecr.us-east-1.amazonaws.com/uma-server:1.0
              ports:
                - name: metrics    # lo leera Prometheus en la practica 3.4
                  containerPort: 9100
              resources:
                requests: { cpu: "250m", memory: "256Mi" }
                limits:   { cpu: "500m", memory: "512Mi" }
